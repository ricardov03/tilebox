[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security headers (nosniff, Referrer-Policy, the CSP of /icons, /thumbs, /blocks, /site, /site-uploads)
# live in public/_headers: Netlify and Cloudflare Pages both read that file. Only cache headers here,
# so no header has two sources.

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
